appId: local.hromadaaid.server-manager
productName: HromadaAID Server Manager
directories:
  app: dist-server-manager/package
  output: release/server-manager
  buildResources: assets
files:
  - main/**/*
  - renderer/**/*
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: assets/release-channel.json
    to: release-channel.json
  - from: packaging/client-update-launcher.ps1
    to: component-update-launcher.ps1
  - from: release/installer-payload/Server
    to: server-payload
  - from: assets
    to: assets
    filter:
      - hromadaaid-server-manager.ico
      - hromadaaid-server-manager.png
      - hromadaaid-server-manager.svg
win:
  icon: assets/hromadaaid-server-manager.ico
  requestedExecutionLevel: requireAdministrator
  target:
    - target: dir
      arch:
        - x64
nsis:
  shortcutName: HromadaAID Server Manager
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: assets/hromadaaid-server-manager.ico
  uninstallerIcon: assets/hromadaaid-server-manager.ico
  installerHeaderIcon: assets/hromadaaid-server-manager.ico

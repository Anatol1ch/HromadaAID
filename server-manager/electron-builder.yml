appId: local.hromadaaid.server-manager
productName: HromadaAID Server Manager
directories:
  app: dist-server-manager/package
  output: release/server-manager
files:
  - main/**/*
  - renderer/**/*
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: release/installer-payload/Server
    to: server-payload
win:
  requestedExecutionLevel: requireAdministrator
  target:
    - target: dir
      arch:
        - x64
